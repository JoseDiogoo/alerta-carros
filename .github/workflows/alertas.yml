name: Alertas de carros

# Corre na nuvem do GitHub sem parar, com o PC desligado: cada execução vigia os sites de 15 em 15 s
# durante ~5h40 e no fim relança-se a si própria. O agendamento de hora a hora
# é só a reserva, caso a cadeia se quebre. Repositório público: minutos do GitHub Actions ilimitados.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: write  # publicar a base no Release "dados" (checkpoint e leitura do painel)
  actions: write  # para se relançar no fim (gh workflow run)

concurrency:
  group: alertas-carros
  cancel-in-progress: false  # há sempre uma só vigia; as outras ficam à espera

jobs:
  alertar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Recuperar o mercado aprendido
        uses: actions/cache/restore@v4
        with:
          path: config.sqlite3
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Configuração da nuvem
        run: |
          sed -e 's/^paginas_exploracao = .*/paginas_exploracao = 2/' config.exemplo.toml > config.toml

      - name: Base mais recente (Release "dados", mais nova do que a cache)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view dados --repo "${{ github.repository }}" >/dev/null 2>&1 || \
            gh release create dados --repo "${{ github.repository }}" --title "Base de dados" \
              --notes "Base SQLite publicada pela vigia de 5 em 5 min (só anúncios públicos)."
          gh release download dados --repo "${{ github.repository }}" -p base.sqlite3 -O config.sqlite3 --clobber \
            || echo "Sem base publicada ainda: usa a da cache."

      - name: Vigiar os sites e enviar alertas (~5h40)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          FACEBOOK_COOKIES: ${{ secrets.FACEBOOK_COOKIES }}
          PUBLICAR_BASE: "1"
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python3 monitor.py --minutos 340

      - name: Guardar o mercado aprendido
        if: always()
        uses: actions/cache/save@v4
        with:
          path: config.sqlite3
          key: estado-${{ github.run_id }}

      - name: Relançar a vigia
        # só se correu bem: um erro não fica em ciclo; o agendamento de hora a hora retoma
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run alertas.yml --repo "${{ github.repository }}" --ref main

      - name: Manter a app Streamlit acordada
        if: always()
        continue-on-error: true
        run: |
          pip install --quiet selenium
          python3 manter_acordada.py
