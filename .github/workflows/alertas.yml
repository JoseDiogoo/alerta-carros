name: Alertas de carros

# Corre na nuvem do GitHub sem parar, com o PC desligado: cada execução vigia os sites de 15 em 15 s
# (e o Facebook via Cloudflare WARP) durante ~5h40 e no fim relança-se a si própria. O agendamento de hora a hora
# é só a reserva, caso a cadeia se quebre. Repositório público: minutos do GitHub Actions ilimitados.
on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions:
  contents: read
  actions: write  # para se relançar no fim (gh workflow run)

concurrency:
  group: alertas-carros
  cancel-in-progress: false  # há sempre uma só vigia; as outras ficam à espera

jobs:
  alertar:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Recuperar o mercado aprendido
        uses: actions/cache/restore@v4
        with:
          path: config.sqlite3
          key: estado-${{ github.run_id }}
          restore-keys: estado-

      - name: Configuração da nuvem
        run: |
          sed -e 's/^paginas_exploracao = .*/paginas_exploracao = 2/' config.exemplo.toml > config.toml

      - name: Instalar e ligar o Cloudflare WARP (VPN para aceder ao Facebook)
        continue-on-error: true
        run: |
          # Adicionar o repositório oficial da Cloudflare
          curl -fsSL https://pkg.cloudflareclient.com/pubkey.gpg | sudo gpg --yes --dearmor --output /usr/share/keyrings/cloudflare-warp-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/cloudflare-warp-archive-keyring.gpg] https://pkg.cloudflareclient.com/ $(lsb_release -cs) main" | sudo tee /etc/apt/sources.list.d/cloudflare-client.list
          sudo apt-get update -qq
          sudo apt-get install -y -qq cloudflare-warp

          # Prevenir conflito de permissões no DNS do runner Ubuntu
          sudo chown root:root /etc/resolv.conf || true

          # Iniciar o daemon
          sudo systemctl start warp-svc

          # Registar conta gratuita de consumidor (não requer credenciais nem registo de equipa)
          warp-cli --accept-tos registration new || true

          # Definir modo VPN e ligar
          warp-cli --accept-tos mode warp || true
          warp-cli --accept-tos connect

          # Aguardar ligação ativa ("Disconnected" também contém "connected": procura a linha exata)
          LIGADO=0
          for i in {1..15}; do
            STATUS=$(warp-cli --accept-tos status 2>&1 || true)
            echo "$STATUS"
            if echo "$STATUS" | grep -q "Status update: Connected"; then
              LIGADO=1
              echo "Cloudflare WARP ligado com sucesso!"
              break
            fi
            sleep 2
          done
          [ "$LIGADO" = 1 ] || echo "::warning::Cloudflare WARP não ligou: o Facebook deve pedir login."

          # Diagnóstico: IP de saída (warp=on) e se o Facebook abre sem login
          curl -s https://www.cloudflare.com/cdn-cgi/trace | grep -E "^(ip|colo|warp)=" || true
          FINAL=$(curl -s -o /dev/null -L -w '%{url_effective}' -A "Mozilla/5.0 (Windows NT 10.0; Win64; x64) Chrome/131.0" \
            "https://www.facebook.com/marketplace/lisbon/vehicles/" || true)
          echo "Facebook abre em: $FINAL"
          case "$FINAL" in *login*) echo "::warning::O Facebook pede login mesmo com o WARP.";; esac

      - name: Vigiar os sites e enviar alertas (~5h40)
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: "-5586087955"
        run: python3 monitor.py --minutos 340

      - name: Desligar Cloudflare WARP
        if: always()
        run: |
          warp-cli --accept-tos disconnect || true

      - name: Guardar o mercado aprendido
        if: always()
        uses: actions/cache/save@v4
        with:
          path: config.sqlite3
          key: estado-${{ github.run_id }}

      - name: Relançar a vigia
        # só se correu bem: um erro não fica em ciclo; o agendamento de hora a hora retoma
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run alertas.yml --repo "${{ github.repository }}" --ref main

      - name: Manter a app Streamlit acordada
        if: always()
        continue-on-error: true
        run: |
          pip install --quiet selenium
          python3 manter_acordada.py
