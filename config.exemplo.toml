# Alerta Carros — critérios de negócio. Todos os valores são editáveis; no painel também mudam ao vivo.

intervalo_segundos = 60        # pausa entre ciclos (mínimo 30)
paginas_max = 5                # páginas lidas por site até encontrar um anúncio já visto
paginas_semente = 15           # páginas antigas lidas no arranque para conhecer o mercado
paginas_exploracao = 3         # páginas antigas extra por ciclo e por site (o mercado cresce sozinho)

# Que carros procurar
modelos = []                   # vazio = TODOS os carros. Ex.: ["toyota yaris", "vw golf"] para restringir
preco_min = 1000
preco_max = 15000
ano_min = 2005
km_max = 250000
km_ano_max = 20000             # média de km por ano de idade
apenas_nacionais = false

# Negócio: valor de mercado = mediana do mesmo modelo, ano ±1 e km parecidos, em todos os sites
custos_revenda = 500           # inspeção, limpeza, pequenas reparações, anúncio (€)
margem_minima = 800            # lucro estimado mínimo para alertar (€)
desconto_mercado = 0.85        # e preço ≤ 85% do valor de mercado
min_comparaveis = 6            # anúncios necessários para estimar o valor
limite_burla = 0.5             # < 50% do mercado → alerta com aviso
descida_minima = 0.05          # anúncio já visto que baixe ≥ 5% volta a ser avaliado

fontes = ["standvirtual", "olx", "custojusto", "autopt", "autox", "facebook"]
facebook_cidades = ["lisbon", "porto"]
facebook_pesquisas = ["carro"] # usado quando a lista de modelos está vazia
facebook_cada_minutos = 10
facebook_faixas = 3            # o Facebook devolve 24 por pesquisa: divide o preço em faixas

# Palavras no título que excluem o anúncio
excluir = [
  "para peças", "peças", "avariado", "sinistrado", "batido", "motor partido",
  "acidentado", "danificado", "damaged", "salvado",
  "retoma", "sinal", "entrada", "prestação", "prestações", "mensalidade", "aluguer",
  "troco", "procuro", "compro",
]
# Palavras procuradas também na descrição (avarias e documentos)
excluir_texto = [
  "para peças", "avariado", "motor partido", "sinistrado", "sem documentos",
  "sem matricula", "matricula estrangeira", "não anda", "precisa de motor",
]
